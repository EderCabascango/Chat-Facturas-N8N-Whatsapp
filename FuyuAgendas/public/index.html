<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuyu Agenda - Gestión Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .top-nav { background: white; padding: 0 24px; height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
        
        .nav-btn { font-size: 16px; font-weight: 800; color: #94a3b8; padding: 8px 20px; border-radius: 14px; transition: all 0.2s; }
        .nav-btn.active { color: #4f46e5; background: #f5f3ff; }
        
        .view-content { display: none; height: calc(100vh - 70px); width: 100%; overflow: hidden; }
        .view-content.active { display: flex; flex-direction: row; }

        /* Calendar Styles */
        .calendar-container { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .calendar-header { height: 80px; background: white; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; }
        .week-grid-header { display: grid; grid-template-columns: 80px repeat(5, 1fr); background: white; border-bottom: 1px solid #e2e8f0; height: 60px; }
        .day-label { display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #f1f5f9; }
        
        .calendar-body { flex: 1; overflow-y: auto; position: relative; background: #fafbfc; }
        .calendar-grid { display: grid; grid-template-columns: 80px repeat(5, 1fr); grid-template-rows: repeat(24, 80px); position: relative; }
        .time-cell { grid-column: 1; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #f1f5f9; background: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 10px; font-size: 11px; font-weight: 800; color: #cbd5e1; position: sticky; left: 0; z-index: 20; }
        .grid-cell { border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        
        .appt-card { position: absolute; left: 8px; right: 8px; border-radius: 16px; padding: 14px; z-index: 10; border-left: 6px solid; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); transition: transform 0.2s; cursor: pointer; }
        .appt-card:hover { transform: translateY(-2px); z-index: 40; }

        /* Modal */
        #modal-cita { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); z-index: 100; align-items: center; justify-content: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="flex items-center space-x-10">
            <div class="flex items-center space-x-3">
                <img src="fuyudatoslogo.png" style="height: 42px;">
                <span class="text-xl font-black text-slate-800 tracking-tighter">Fuyu <span class="text-indigo-600">Agenda</span></span>
            </div>
            <div class="flex space-x-1">
                <button onclick="switchView('agenda')" id="btn-agenda" class="nav-btn active">Agenda</button>
                <button onclick="switchView('pacientes')" id="btn-pacientes" class="nav-btn">Pacientes</button>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="openModal()" class="bg-indigo-600 text-white px-7 py-3.5 rounded-[20px] font-black text-sm shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition-all">+ Nueva Cita</button>
            <div class="w-11 h-11 rounded-2xl bg-slate-800 text-white flex items-center justify-center font-bold shadow-lg">WL</div>
        </div>
    </nav>

    <!-- VISTA AGENDA -->
    <div id="view-agenda" class="view-content active">
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="flex items-center space-x-6">
                    <h2 id="current-month-year" class="text-2xl font-black text-slate-800 tracking-tight capitalize">Mayo 2026</h2>
                    <div class="flex bg-slate-100 p-1 rounded-xl">
                        <button onclick="changeWeek(-1)" class="p-2 hover:bg-white rounded-lg transition-all"><svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
                        <button onclick="changeWeek(1)" class="p-2 hover:bg-white rounded-lg transition-all"><svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg></button>
                    </div>
                </div>
                <div class="flex items-center space-x-2 text-xs font-black text-slate-400 uppercase tracking-widest">
                    <div class="w-3 h-3 bg-indigo-500 rounded-full"></div>
                    <span>Semana Actual</span>
                </div>
            </div>
            
            <div class="week-grid-header" id="week-header">
                <div class="border-r border-slate-100"></div>
                <!-- Días dinámicos aquí -->
            </div>

            <div class="calendar-body no-scrollbar">
                <div class="calendar-grid" id="calendar-grid"></div>
            </div>
        </div>
    </div>

    <!-- VISTA PACIENTES -->
    <div id="view-pacientes" class="view-content">
        <div class="w-[380px] border-r border-slate-100 bg-white overflow-y-auto p-8 no-scrollbar" id="patient-list"></div>
        <div class="flex-1 bg-white p-16 overflow-y-auto no-scrollbar" id="history-detail">
            <div class="h-full flex flex-col items-center justify-center text-slate-200">
                <div class="w-32 h-32 bg-slate-50 rounded-[40px] flex items-center justify-center mb-6">
                    <svg class="w-16 h-16 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <p class="font-black text-sm uppercase tracking-[0.3em]">Gestión de Pacientes</p>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVA CITA -->
    <div id="modal-cita">
        <div class="bg-white rounded-[40px] w-full max-w-lg p-12 shadow-2xl">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h2 class="text-3xl font-black text-slate-800 tracking-tight">Nueva Cita</h2>
                    <p class="text-indigo-600 font-bold text-xs uppercase mt-1 tracking-widest">Agendamiento Manual</p>
                </div>
                <button onclick="closeModal()" class="text-slate-300 hover:text-slate-500"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Nombre Completo</label>
                    <input id="f-nombre" type="text" class="w-full bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white rounded-2xl p-4 font-bold text-slate-700 outline-none transition-all">
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Fecha (DD/MM/AAAA)</label>
                        <input id="f-fecha" type="text" placeholder="13/05/2026" class="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Hora (HH:MM AM/PM)</label>
                        <input id="f-hora" type="text" placeholder="10:00 AM" class="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Servicio o Motivo de Consulta</label>
                    <textarea id="f-servicio" rows="3" class="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none resize-none"></textarea>
                </div>
                <div class="pt-6">
                    <button onclick="saveCita()" class="w-full bg-slate-800 text-white py-5 rounded-[24px] font-black shadow-2xl uppercase text-xs tracking-[0.2em] hover:bg-slate-900 transition-all">Confirmar Agendamiento</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'fuyu_prod_secret_2026';
        let currentStartDate = new Date(2026, 4, 11); // Lunes 11 de Mayo de 2026

        function switchView(view) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');
            document.getElementById(`btn-${view}`).classList.add('active');
        }

        function openModal() { document.getElementById('modal-cita').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-cita').style.display = 'none'; }

        function changeWeek(direction) {
            currentStartDate.setDate(currentStartDate.getDate() + (direction * 7));
            updateCalendar();
        }

        async function saveCita() {
            const data = {
                cliente: document.getElementById('f-nombre').value,
                fecha: document.getElementById('f-fecha').value,
                hora: document.getElementById('f-hora').value,
                servicio: document.getElementById('f-servicio').value
            };
            await fetch('/api/webhook/citas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                body: JSON.stringify(data)
            });
            closeModal();
            updateCalendar();
        }

        function updateCalendar() {
            const header = document.getElementById('week-header');
            const grid = document.getElementById('calendar-grid');
            const monthYearLabel = document.getElementById('current-month-year');
            
            // Header
            header.innerHTML = '<div class="border-r border-slate-100"></div>';
            const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
            const tempDate = new Date(currentStartDate);
            
            monthYearLabel.innerText = tempDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' });

            for (let i = 0; i < 5; i++) {
                const dayNum = tempDate.getDate();
                const monthName = tempDate.toLocaleString('es-ES', { month: 'short' });
                header.innerHTML += `
                    <div class="day-label border-r border-slate-50">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">${days[i]}</span>
                        <span class="text-xl font-black text-slate-800">${dayNum} <span class="text-sm font-bold text-indigo-400 uppercase">${monthName}</span></span>
                    </div>
                `;
                tempDate.setDate(tempDate.getDate() + 1);
            }

            // Body Grid
            grid.innerHTML = '';
            for (let h = 8; h <= 20; h++) {
                grid.innerHTML += `<div class="time-cell"><span>${h}:00</span><span class="opacity-30 text-[9px]">${h > 12 ? 'PM' : 'AM'}</span></div>`;
                for (let i = 0; i < 5; i++) grid.innerHTML += `<div class="grid-cell"></div>`;
            }
            renderCitas();
        }

        async function renderCitas() {
            try {
                const res = await fetch('/api/citas', { headers: { 'x-api-key': API_KEY } });
                const data = await res.json();
                const grid = document.getElementById('calendar-grid');
                
                // API devuelve {total, citas:[...]} 
                const citas = data.citas || data || [];
                
                citas.forEach((cita, idx) => {
                    // Saltar citas sin datos válidos
                    if (!cita.fecha || !cita.cliente || !cita.hora) return;
                    if (cita.estado === 'cancelada') return;
                    
                    const parts = cita.fecha.split('/');
                    if (parts.length < 3) return;
                    const [d, m, y] = parts;
                    const citaDate = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
                    const diffDays = Math.floor((citaDate - currentStartDate) / (1000 * 60 * 60 * 24));
                    
                    if (diffDays >= 0 && diffDays < 5) {
                        const timeStr = cita.hora || '09:00 AM';
                        let h = 9, min = 0;
                        
                        // Parseo robusto: funciona con "10:00 AM", "14:00", "2:00 PM"
                        if (timeStr.includes(':')) {
                            const timeParts = timeStr.trim().split(' ');
                            const [hRaw, minRaw] = timeParts[0].split(':').map(Number);
                            h = hRaw || 9;
                            min = minRaw || 0;
                            const period = timeParts[1] || '';
                            if (period.toUpperCase() === 'PM' && h < 12) h += 12;
                            if (period.toUpperCase() === 'AM' && h === 12) h = 0;
                        }
                        
                        const top = (((h - 8) * 60 + min) / 60) * 80;
                        const colors = ['bg-white border-indigo-500 text-slate-800', 'bg-white border-emerald-500 text-slate-800'];
                        
                        const div = document.createElement('div');
                        div.className = `appt-card ${colors[idx % 2]}`;
                        div.style.top = `${top}px`;
                        div.style.left = `calc(80px + (${diffDays} * (100% - 80px) / 5) + 8px)`;
                        div.style.width = `calc((100% - 80px) / 5 - 16px)`;
                        div.style.height = `90px`;
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-[10px] font-black text-indigo-600 uppercase tracking-tighter">${cita.hora}</span>
                                <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
                            </div>
                            <p class="font-black text-xs tracking-tight leading-tight mb-0.5 truncate">${cita.cliente}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter leading-tight truncate">${cita.servicio}</p>
                        `;
                        grid.appendChild(div);
                    }
                });
            } catch (e) {
                console.error('Error renderCitas:', e);
            }
        }

        async function loadClientes() {
            const res = await fetch('/api/clientes', { headers: { 'x-api-key': API_KEY } });
            const clientesData = await res.json();
            const list = document.getElementById('patient-list');
            list.innerHTML = `<h2 class="text-xs font-black text-slate-300 uppercase tracking-[0.3em] mb-10">Directorio</h2>`;
            
            clientesData.forEach(c => {
                const div = document.createElement('div');
                div.className = 'group p-6 rounded-[32px] hover:bg-slate-50 cursor-pointer mb-4 transition-all border border-transparent hover:border-slate-100';
                div.innerHTML = `
                    <div class="flex items-center space-x-5">
                        <div class="w-14 h-14 bg-white shadow-sm border border-slate-100 rounded-2xl flex items-center justify-center font-black text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-all text-xl">${c.nombre[0]}</div>
                        <div class="flex-1">
                            <p class="font-black text-slate-800 tracking-tight">${c.nombre}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">CI: ${c.cedula || 'N/A'} | Tel: ${c.telefono}</p>
                        </div>
                    </div>
                `;
                div.onclick = () => showHistory(c);
                list.appendChild(div);
            });
        }

        function showHistory(cliente) {
            const detail = document.getElementById('history-detail');
            detail.innerHTML = `
                <div class="max-w-3xl mx-auto">
                    <div class="bg-slate-50 rounded-[50px] p-12 mb-12">
                        <h2 class="text-5xl font-black text-slate-800 tracking-tighter mb-4">${cliente.nombre}</h2>
                        <div class="flex items-center space-x-3">
                             <span class="bg-indigo-600 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest">Hoja de Vida Activa</span>
                             <span class="text-slate-400 text-xs font-bold italic">Sincronizado con WhatsApp</span>
                        </div>
                        <div class="grid grid-cols-3 gap-12 mt-12 pt-12 border-t border-slate-200">
                            <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Teléfono Móvil</p><p class="text-xl font-black text-slate-700">${cliente.telefono}</p></div>
                            <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Visitas Totales</p><p class="text-xl font-black text-slate-700">${cliente.total_visitas || 0}</p></div>
                            <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Último Contacto</p><p class="text-xl font-black text-slate-700">${cliente.ultima_cita}</p></div>
                        </div>
                    </div>
                    <div class="space-y-8">
                        <h3 class="text-xs font-black text-slate-300 uppercase tracking-[0.4em] px-8">Historial de Intervenciones</h3>
                        ${cliente.historial.map(h => `
                            <div class="bg-white rounded-[40px] p-10 border border-slate-100 shadow-sm relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-2 bg-indigo-500"></div>
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-sm font-black text-indigo-600 tracking-tight">${h.fecha}</span>
                                    <span class="bg-slate-50 text-slate-400 px-4 py-1 rounded-full text-[10px] font-black uppercase">Reporte Cerrado</span>
                                </div>
                                <h4 class="text-2xl font-black text-slate-800 tracking-tight mb-4">${h.motivo}</h4>
                                <p class="text-slate-500 leading-relaxed font-medium text-lg">${h.notas}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        updateCalendar();
        setInterval(() => { renderCitas(); }, 30000);
    </script>
</body>
</html>
