<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuyu App - Tu solución en datos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Slate 50 (Light Mode) */
            color: #0f172a; /* Slate 900 */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8); /* Slate 200 border */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .text-fuyu-blue {
            color: #172554; /* Un azul muy oscuro y elegante para 'Fuyu' */
        }
        .text-fuyu-yellow {
            color: #eab308; /* Amarillo vibrante para 'App' */
        }
    </style>
</head>
<body class="min-h-screen p-4 pb-20">
    <!-- Header -->
    <header class="flex justify-between items-center mb-6 pt-4">
        <div class="flex items-center">
            <img src="./fuyudatoslogo.png" alt="Logo Fuyu" class="h-14 w-auto mr-3 object-contain drop-shadow-sm">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">
                    <span class="text-fuyu-blue">Fuyu</span><span class="text-fuyu-yellow">App</span>
                </h1>
                <p class="text-slate-500 text-sm font-medium">Tu solución en datos</p>
            </div>
        </div>
        <div class="h-10 w-10 rounded-full bg-white flex items-center justify-center border border-slate-200 shadow-sm">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </div>
    </header>

    <!-- Suma Total Component -->
    <section class="glass-card rounded-3xl p-6 mb-8 relative overflow-hidden">
        <!-- Decoración de fondo suave -->
        <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-yellow-400 opacity-10 blur-2xl"></div>
        <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-32 h-32 rounded-full bg-blue-500 opacity-5 blur-2xl"></div>
        
        <p class="text-slate-500 text-sm font-semibold mb-1">Total Ingresado Hoy</p>
        <h2 class="text-4xl font-extrabold tracking-tight mb-4 text-slate-800">$<span id="total-amount">0.00</span></h2>
        
        <div class="flex items-center text-sm">
            <span class="flex items-center text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-100 font-medium">
                <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                Sincronizado
            </span>
        </div>
    </section>

    <!-- Últimos Pagos -->
    <section>
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-slate-800">Últimos Pagos</h3>
            <div class="flex space-x-2">
                <button onclick="downloadExcel()" class="text-sm text-emerald-700 font-semibold flex items-center bg-white px-2.5 py-1.5 rounded-lg border border-emerald-200 shadow-sm active:bg-emerald-50 transition-colors">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Excel
                </button>
                <button onclick="fetchData()" class="text-sm text-fuyu-blue font-semibold flex items-center bg-white px-2.5 py-1.5 rounded-lg border border-slate-200 shadow-sm active:bg-slate-50 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
        
        <div id="transactions-list" class="space-y-3">
            <p class="text-center text-slate-500 py-4 font-medium">Cargando datos...</p>
        </div>
    </section>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 w-full glass-card border-t border-slate-200 flex justify-around py-3 pb-5 px-2 z-50">
        <a href="#" class="flex flex-col items-center text-fuyu-blue">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-xs font-bold">Inicio</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="text-xs font-medium">Facturas</span>
        </a>
    </nav>

    <script>
        async function fetchData() {
            const listEl = document.getElementById('transactions-list');
            const totalEl = document.getElementById('total-amount');
            
            try {
                console.log("Iniciando descarga de datos...");
                const response = await fetch('/api/facturas', {
                    headers: { 'x-api-key': 'fuyu_prod_secret_2026' }
                });
                const data = await response.json();
                console.log("Datos recibidos:", data);
                
                if (!Array.isArray(data) || data.length === 0) {
                    listEl.innerHTML = '<p class="text-center text-slate-500 py-8 font-medium">No hay facturas registradas aún.</p>';
                    totalEl.innerText = "0.00";
                    return;
                }

                // Calcular Total
                let sum = 0;
                data.forEach(f => { sum += parseFloat(f.monto) || 0; });
                totalEl.innerText = sum.toFixed(2);

                // Generar HTML
                let html = '';
                for (const factura of data) {
                    const banco = String(factura.banco || "Banco").toUpperCase();
                    const monto = (parseFloat(factura.monto) || 0).toFixed(2);
                    const emisor = factura.emisor || "Desconocido";
                    const ref = factura.referencia || "-";
                    const fecha = factura.fecha || "";
                    
                    html += `
                    <div class="glass-card rounded-2xl p-4 flex justify-between items-center transition-all hover:shadow-md">
                        <div class="flex items-center">
                            <div class="w-12 h-12 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center mr-4 text-xl font-bold text-blue-800">
                                ${banco.charAt(0)}
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-800 leading-tight">${banco}</h4>
                                <p class="text-[11px] font-medium text-slate-500">${emisor} • ${fecha}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-emerald-600 text-lg">+$${monto}</p>
                            <p class="text-[10px] font-semibold text-slate-400 uppercase">Ref: ${ref}</p>
                        </div>
                    </div>`;
                }
                listEl.innerHTML = html;
                
            } catch (err) {
                console.error("Error crítico:", err);
                listEl.innerHTML = `<div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm">
                    <b>Error de carga:</b> ${err.message}<br>
                    Intenta recargar la página.
                </div>`;
            }
        }

        async function downloadExcel() {
            try {
                const response = await fetch('/api/facturas', {
                    headers: { 'x-api-key': 'fuyu_prod_secret_2026' }
                });
                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    alert('No hay facturas registradas para exportar.');
                    return;
                }

                // Preparar datos ordenados para Excel (Seguro contra datos corruptos)
                const excelData = data.map(item => {
                    const dateObj = item.timestamp ? new Date(item.timestamp) : null;
                    return {
                        'Banco': String(item.banco || 'Desconocido').toUpperCase(),
                        'Fecha de Pago': item.fecha || '-',
                        'Hora de Recepción': (dateObj && !isNaN(dateObj.getTime())) ? dateObj.toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' }) : '-',
                        'Monto ($)': parseFloat(item.monto) || 0,
                        'Referencia': item.referencia || '-',
                        'Emisor': item.emisor || '-',
                        'ID Interno': item.id || '-'
                    };
                });

                // Crear el archivo usando SheetJS
                const worksheet = XLSX.utils.json_to_sheet(excelData);
                
                // Dar un poco de formato a las columnas (anchos)
                const wscols = [
                    {wch: 15}, {wch: 15}, {wch: 20}, {wch: 12}, {wch: 20}, {wch: 25}, {wch: 20}
                ];
                worksheet['!cols'] = wscols;

                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Facturas Fuyu");
                
                // Generar y descargar (Ej: Facturas_Fuyu_24-3-2026.xlsx)
                const dateStr = new Date().toLocaleDateString('es-EC').replace(/\//g, '-');
                XLSX.writeFile(workbook, `Facturas_Fuyu_${dateStr}.xlsx`);
                
            } catch (error) {
                console.error('Error exporting data:', error);
                alert('Ocurrió un error al intentar exportar el archivo.');
            }
        }

        // Cargar datos al iniciar
        fetchData();
        // Refrescar cada 10 segundos
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
