version: '3.8'

services:
  # Aplicación Original de Facturas (Puerto 3000)
  fuyu-facturas:
    build:
      context: ./mobile_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./mobile_app/data:/app/data
    restart: always

  # Nueva Aplicación de Agenda Profesional (Puerto 3001)
  fuyu-agenda:
    build:
      context: ./FuyuAgendas
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - API_KEY=fuyu_prod_secret_2026
    volumes:
      - ./FuyuAgendas/data:/app/data
    restart: always

networks:
  default:
    name: fuyu-network
