services:
  # Base de Datos Postgres
  fuyu-db:
    image: postgres:16-alpine
    container_name: fuyu_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - fuyu_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fuyu-network

  # Redis (Requerido por Evolution API v2)
  redis:
    image: redis:latest
    container_name: fuyu_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fuyu-network

  # Evolution API v2
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      
      # Base de Datos
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fuyu-db:5432/${POSTGRES_DB}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      
      # Redis Config
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
    depends_on:
      fuyu-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fuyu-network

  # n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=fuyu-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - FUYU_API_KEY=${FUYU_API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      fuyu-db:
        condition: service_healthy
    networks:
      - fuyu-network

  # Aplicación Original de Facturas (Puerto 3000)
  fuyu-facturas:
    build:
      context: ./mobile_app
    container_name: fuyu_dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_KEY=${FUYU_API_KEY}
    volumes:
      - ./mobile_app/data:/usr/src/app/data
    restart: always
    networks:
      - fuyu-network

  # Nueva Aplicación de Agenda Profesional (Puerto 3001)
  fuyu-agenda:
    build:
      context: ./FuyuAgendas
    container_name: fuyu_agenda
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - API_KEY=${FUYU_API_KEY}
    volumes:
      - ./FuyuAgendas/data:/app/data
    restart: always
    networks:
      - fuyu-network

networks:
  fuyu-network:
    name: fuyu-network
    driver: bridge

volumes:
  fuyu_db_data:
  redis_data:
  n8n_data:
