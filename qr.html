<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Pichincha - Conexión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 400px; }
        h1 { color: #facc15; margin-bottom: 1rem; }
        #qr-container { background: white; padding: 1rem; border-radius: 0.5rem; margin: 1.5rem 0; min-height: 200px; display: flex; align-items: center; justify-content: center; }
        #qr-image { max-width: 100%; display: none; }
        .status { font-size: 0.9rem; color: #94a3b8; }
        .btn { background: #facc15; color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn:hover { background: #eab308; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Conectar WhatsApp</h1>
        <p>Escanea el código QR desde WhatsApp para activar la automatización.</p>
        <div id="qr-container">
            <img id="qr-image" alt="QR Code">
            <p id="loading-text" style="color: #0f172a;">Cargando QR...</p>
        </div>
        <div class="status" id="status-text">Estado: Desconectado</div>
        <button class="btn" onclick="fetchQR()">Recargar QR</button>
    </div>

    <script>
        const API_KEY = '123456';
        const INSTANCE = 'pichincha';

        async function fetchQR() {
            const loadingText = document.getElementById('loading-text');
            const qrImage = document.getElementById('qr-image');
            const statusText = document.getElementById('status-text');

            try {
                const response = await fetch(`http://localhost:8080/instance/connect/${INSTANCE}`, {
                    headers: { 'apikey': API_KEY }
                });
                const data = await response.json();

                if (data.base64) {
                    qrImage.src = data.base64;
                    qrImage.style.display = 'block';
                    loadingText.style.display = 'none';
                    statusText.innerText = 'Estado: QR Generado';
                } else if (data.status === 'connected' || (data.instance && data.instance.state === 'open')) {
                    statusText.innerText = 'Estado: Conectado!';
                    loadingText.innerText = '¡Ya estás conectado!';
                    loadingText.style.display = 'block'; // Make sure this is visible if it says connected
                    qrImage.style.display = 'none';
                } else {
                    statusText.innerText = 'Esperando QR...';
                    setTimeout(fetchQR, 5000);
                }
            } catch (err) {
                console.error(err);
                statusText.innerText = 'Error al conectar con la API';
            }
        }

        fetchQR();
    </script>
</body>
</html>
